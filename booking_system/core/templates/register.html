{% extends "static.html" %} 
{% block title %}Реєстрація{% endblock %} 
 
{% block nav %}{% endblock %}

{% block content %}
<head>
    <style>
        body{
            background-color: rgba(58, 73, 61, 0.664);
            background-image: url('https://i.pinimg.com/736x/41/cd/45/41cd4589c367a7ba296ae6468817d982.jpg');
        }
        .form-container {
            height: 500px;
            width: 450px;
            background-color: rgba(51, 52, 70, 0.9);
            border-radius: 25px;
            border: 4px solid rgb(88, 94, 88);
            text-align:center;
            margin: 50px auto;
            

        }

        .form-title {
            color: rgb(255, 255, 255);
            font-size: 30px;
            font-width: bold;
            font-size:40;
            font-weight: 800;
        }

        .form-text-login {
            display: block;
            color: rgb(255, 255, 255);
            font-weight: 800px;
            padding-right: 170px;


        }

        .form-text-password {
            display:block;
            color: rgb(255, 255, 255);
            font-weight:800px;
            padding-right: 170px;

        }

        .form-link {
            color: rgb(255, 255, 255)
        }

        .form-input-login {
            border-radius:10px;
            width:245px;
            height:30px;
            position:center;
            margin-bottom:10px;
        }
        .form-input-password {
            border-radius:10px;
            width:245px;
            height:30;
            position:center;
        }
        .form-button-register {
            background-color: rgb(12, 89, 184);
            color: rgb(255, 255, 255);
            margin-top: 40px;
            margin-bottom:40px;
            border-radius: 10px;
            width: 300px;
            height: 50px;
            font-size: 20px;
            font-weight: 800;
        }

    </style>
</head>
<body>
    <div class="form-container"> 
        <h2 class="form-title">Реєстрація</h2> 
        <form method="post" action="/register/form"> 
            <div class="form-group"> 
                <label class="form-text-login" for="login" >Логін</label> 
                <input class='form-input-login' type="text" id="login" name="login" required> 
            </div> 
            <div class="form-group"> 
                <label class='form-text-password' for="password">Пароль</label> 
                <input class='form-input-password' type="password" id="password" name="password" required> 
            </div> 
            <button type="submit" class="form-button-register">Зареєструватися</button> 
        </form> 
        <p class="form-link">Вже є акаунт? <a href="/login">Увійти</a></p> 
    </div> 
</body>
{% endblock %}
