<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Booking System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'core:home' %}">Booking System</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{% url 'core:rooms' %}">Кімнати</a>
                <a class="nav-link" href="{% url 'reviews:reviews' %}">Відгуки</a>
                {% if user.is_authenticated %}
                    <a class="nav-link" href="{% url 'core:my_bookings' %}">Мої замовлення</a>
                    <form method="post" action="{% url 'auth:logout' %}" class="d-inline">
                        {% csrf_token %}
                        <button class="btn btn-link nav-link">Вийти ({{ user.username }})</button>
                    </form>
                {% else %}
                    <a class="nav-link" href="{% url 'auth:login' %}">Вхід</a>
                    <a class="nav-link" href="{% url 'auth:register' %}">Реєстрація</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-info">{{ message }}</div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
