<DOCTYPE html>
{% extends "static.html" %} 
{% block title %}Вхід{% endblock %} 
{% block nav %}{% endblock %}
{% block content %} 
<head>
    <title>Вхід</title>
    <style>
        body {
            background-color: rgba(58, 73, 61, 0.664);
            background-image: url('https://i.pinimg.com/736x/e8/61/7b/e8617b23907e9aeb12a77e01ee827a2c.jpg');
        }
        .card {
            height:500px;
            width: 450px;
            text-align: center;
            background:rgba(51, 52, 70, 0.9);
            position: center;
            
            border: 4px solid rgba(234, 234, 240, 0.266);
            border-radius: 25px;

            margin:50px auto;

        }
        .card_text_title {
            color: rgb(255, 255, 255);
            font-size: 30px;
            font-width: bold;
            font-size:40px;
            font-weight: 800;
        }
        
        .card_text_username {
            display:block;
            margin-top: 45px;
            color: rgb(255, 255, 255);
            padding-right:175px;
        }
        .card_text_password {
            display:block;
            color: rgb(255, 255, 255);
            padding-right:175px;
        }
        .card_input_username {
            position:center;
            background-color: rgb(255, 255, 255);
            width:245px;
            height:30px;
            border-radius: 10px;
            margin-bottom:10px;
        }
        .card_input_password {
            position:center;
            background-color: rgb(255, 255, 255);
            width:245px;
            height:30px;
            border-radius: 10px;

        }
        .card_text_none-account {
            margin-top: 40px;
            margin-bottom:40px;
            color: rgb(255,255,255)
        }
        .card_button {
            background-color: rgb(87, 84, 241);
            color: rgb(255, 255, 255);
            margin-top: 20px;
            margin-bottom:40px;
            border-radius: 10px;
            width: 245px;
            height: 50px;
            font-size:17px;
            font-weight: 800;
        }
    </style>

</head>
<body>
    <div class ="card"> 
        <h2 class="card_text_title">Вхід</h2> 
        <form id="loginForm" onsubmit="doLogin(event)">
            <div class="form-group">
                <label class ="card_text_username" for="login">Логін</label>
                <input class = 'card_input_username' type="text" id="login" name="login" required>
            </div>
            <div class="form-group">
                <label class='card_text_password' for="password">Пароль</label>
                <input class ='card_input_password' type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="card_button">Увійти</button>
            <p id="loginError" style="color: red; display: none;"></p>
        </form>
        <script>
        async function doLogin(e) {
            e.preventDefault();
            const login = document.getElementById('login').value;
            const password = document.getElementById('password').value;
            const body = new URLSearchParams();
            body.append('username', login);
            body.append('password', password);
            try {
                const res = await fetch('/login', { method: 'POST', body });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('access_token', data.access_token);
                    window.location.href = '/';
                } else {
                    document.getElementById('loginError').style.display = 'block';
                    document.getElementById('loginError').innerText = data.detail || 'Помилка входу';
                }
            } catch (err) {
                document.getElementById('loginError').style.display = 'block';
                document.getElementById('loginError').innerText = "Сервер недоступний";
            }
        }
        </script> 
        <p class="card_text_none-account">Немає акаунту? <a href="/register">Зареєструватися</a></p> 
    </div>
</body>
</DOCTYPE>
{% endblock %}
